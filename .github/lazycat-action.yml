version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: peach

build:
  toolchains: []
  run_buildscript: false

images:
  # Upstream publishes immutable version tags plus a moving `edge` channel.
  - id: peach
    target: service
    service: peach
    source: docker.io/longmeidao/peach
    channel: stable
    sort: semver
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Peach
    summary: "单用户、本地优先的个人媒体（影片馆藏）管理系统"